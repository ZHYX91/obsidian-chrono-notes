name: Bug report
description: Report a reproducible Chrono Notes problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Chrono Notes. Security vulnerabilities belong in private vulnerability reporting, not this public form. Remove or replace private Vault paths, note and task content, calendar and ICS data, source URLs, credentials, and personal information before attaching files, logs, or screenshots.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Chrono Notes, Obsidian, and operating-system versions
      placeholder: Chrono Notes version; Obsidian version; operating system and version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure ...
        2. Open ...
        3. Select ...
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal sample and logs
      description: Include only sanitized settings, note frontmatter, task text, calendar or ICS excerpts, console errors, screenshots, or a minimal test Vault when useful.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I reproduced this with the latest Chrono Notes release.
          required: true
        - label: I removed or replaced private Vault paths, note and task content, calendar and ICS data, source URLs, credentials, and personal information.
          required: true
