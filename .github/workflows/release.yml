name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact x.y.z version to preflight before creating a tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Verify release version
        run: node scripts/check-release-version.mjs "$RELEASE_VERSION"

      - name: Verify runtime contract
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci

      - name: Run release gates
        run: npm run release:check

      - name: Build manual installation archive
        run: node scripts/release-assets.mjs archive --version "$RELEASE_VERSION"

      - name: Verify read-only preflight source identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REF: ${{ github.ref }}
        id: source
        shell: bash
        run: |
          expected_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          checkout_commit="$(git rev-parse "HEAD^{commit}")"
          remote_default_ref="refs/heads/${DEFAULT_BRANCH}"

          if [[ -z "$DEFAULT_BRANCH" ]] || ! git check-ref-format --branch "$DEFAULT_BRANCH" >/dev/null; then
            echo "The repository default branch is missing or invalid." >&2
            exit 1
          fi
          if [[ "$checkout_commit" != "$expected_commit" ]]; then
            echo "The checked-out commit no longer matches the workflow event commit." >&2
            exit 1
          fi
          if [[ "$EVENT_REF" != "$remote_default_ref" ]]; then
            echo "Release preflight must run from the repository default branch." >&2
            exit 1
          fi

          remote_default_commit="$(git ls-remote --exit-code origin "$remote_default_ref" | awk -v ref="$remote_default_ref" '$2 == ref { print $1 }')"
          if [[ -z "$remote_default_commit" || "$expected_commit" != "$remote_default_commit" ]]; then
            echo "Release preflight must run at the current remote default-branch HEAD." >&2
            exit 1
          fi
          if [[ -n "$(git ls-remote origin "refs/tags/${RELEASE_VERSION}" "refs/tags/${RELEASE_VERSION}^{}")" ]]; then
            echo "Release preflight requires a version whose remote tag does not exist." >&2
            exit 1
          fi
          echo "release_commit=${expected_commit}" >> "$GITHUB_OUTPUT"

      - name: Validate published version history and release-notes baseline
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
        shell: bash
        run: |
          releases_response="$RUNNER_TEMP/published-releases.json"
          gh api --paginate --slurp \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$releases_response"
          previous_tag="$(node scripts/release-notes-baseline.mjs --current-version "$RELEASE_VERSION" < "$releases_response")"
          if [[ -n "$previous_tag" ]]; then
            previous_ref="refs/tags/${previous_tag}"
            git fetch --quiet --no-tags origin "$previous_ref"
            previous_commit="$(git rev-parse "FETCH_HEAD^{commit}")"
            if ! git merge-base --is-ancestor "$previous_commit" "$RELEASE_COMMIT"; then
              echo "The previous published Release is not an ancestor of this candidate." >&2
              exit 1
            fi
          fi
          echo "Read-only preflight passed for ${RELEASE_VERSION} at ${RELEASE_COMMIT}; notes baseline: ${previous_tag:-none}."

  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: read
    outputs:
      candidate_artifact_digest: ${{ steps.upload_candidate.outputs.artifact-digest }}
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      previous_tag: ${{ steps.release_notes.outputs.previous_tag }}
      release_commit: ${{ steps.source.outputs.release_commit }}
      release_exists: ${{ steps.release_state.outputs.exists }}
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Verify release version
        run: node scripts/check-release-version.mjs "$RELEASE_VERSION"

      - name: Verify runtime contract
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci

      - name: Run release gates
        run: npm run release:check

      - name: Build manual installation archive
        run: node scripts/release-assets.mjs archive --version "$RELEASE_VERSION"

      - name: Verify tag source identity under read-only permissions
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          expected_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          checkout_commit="$(git rev-parse "HEAD^{commit}")"
          remote_default_ref="refs/heads/${DEFAULT_BRANCH}"
          tag_ref="refs/tags/${RELEASE_VERSION}"

          if [[ -z "$DEFAULT_BRANCH" ]] || ! git check-ref-format --branch "$DEFAULT_BRANCH" >/dev/null; then
            echo "The repository default branch is missing or invalid." >&2
            exit 1
          fi
          if [[ "$checkout_commit" != "$expected_commit" ]]; then
            echo "The checked-out commit no longer matches the release event commit." >&2
            exit 1
          fi
          remote_default_commit="$(git ls-remote --exit-code origin "$remote_default_ref" | awk -v ref="$remote_default_ref" '$2 == ref { print $1 }')"
          if [[ -z "$remote_default_commit" ]]; then
            echo "Could not resolve the repository default branch from origin." >&2
            exit 1
          fi
          remote_tag_commit="$(git ls-remote --exit-code origin "$tag_ref" "${tag_ref}^{}" | awk -v peeled="${tag_ref}^{}" -v direct="$tag_ref" '$2 == peeled { print $1; found=1 } $2 == direct { fallback=$1 } END { if (!found) print fallback }')"
          if [[ -z "$remote_tag_commit" || "$remote_tag_commit" != "$expected_commit" ]]; then
            echo "The remote release tag no longer points to the pushed event commit." >&2
            exit 1
          fi
          git fetch --quiet --no-tags origin "$remote_default_ref"
          if ! git merge-base --is-ancestor "$expected_commit" "$remote_default_commit"; then
            echo "The release commit is not reachable from the current remote default branch." >&2
            exit 1
          fi
          echo "release_commit=${expected_commit}" >> "$GITHUB_OUTPUT"

      - name: Accept an exact existing immutable Release under read-only permissions
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
        shell: bash
        run: |
          verify_tag() {
            local object type sha
            object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" --jq '.object')"
            type="$(jq -r '.type' <<< "$object")"
            sha="$(jq -r '.sha' <<< "$object")"
            for _ in {1..10}; do
              [[ "$type" == "tag" ]] || break
              object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object')"
              type="$(jq -r '.type' <<< "$object")"
              sha="$(jq -r '.sha' <<< "$object")"
            done
            [[ "$type" == "commit" && "$sha" == "$RELEASE_COMMIT" ]]
          }

          release_response="$RUNNER_TEMP/tagged-release.json"
          release_status="$(curl --silent --show-error --output "$release_response" --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}")"
          case "$release_status" in
            "200")
              archive_name="chrono-notes-${RELEASE_VERSION}.zip"
              jq --exit-status --arg archive_name "$archive_name" '
                .immutable == true and .draft == false and .prerelease == false and
                (.assets | type == "array") and
                ([.assets[].name] | sort) == (["main.js", "manifest.json", "styles.css", $archive_name] | sort) and
                ([.assets[].name] | unique | length) == 4
              ' "$release_response" >/dev/null || {
                echo "The tagged Release is not the exact immutable stable contract; publish a new version." >&2
                exit 1
              }
              existing="$RUNNER_TEMP/existing-release-assets"
              mkdir "$existing"
              gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$existing" \
                --pattern main.js --pattern manifest.json --pattern styles.css --pattern "$archive_name"
              for asset in main.js manifest.json styles.css "$archive_name"; do
                cmp "dist/$asset" "$existing/$asset"
                gh attestation verify "$existing/$asset" \
                  --repo "$GITHUB_REPOSITORY" \
                  --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
                  --deny-self-hosted-runners \
                  --source-ref "$GITHUB_REF" \
                  --source-digest "$RELEASE_COMMIT"
              done
              verify_tag || {
                echo "The release tag changed while the existing Release was verified." >&2
                exit 1
              }
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            "404") echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Could not query the tagged Release (HTTP ${release_status})." >&2; exit 1 ;;
          esac

      - name: Select and validate the previous published Release
        if: steps.release_state.outputs.exists == 'false'
        id: release_notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
        shell: bash
        run: |
          releases_response="$RUNNER_TEMP/published-releases.json"
          gh api --paginate --slurp \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$releases_response"
          previous_tag="$(node scripts/release-notes-baseline.mjs --current-version "$RELEASE_VERSION" < "$releases_response")"
          if [[ -n "$previous_tag" ]]; then
            previous_ref="refs/tags/${previous_tag}"
            git fetch --quiet --no-tags origin "$previous_ref"
            previous_commit="$(git rev-parse "FETCH_HEAD^{commit}")"
            if ! git merge-base --is-ancestor "$previous_commit" "$RELEASE_COMMIT"; then
              echo "The previous published Release is not an ancestor of this release." >&2
              exit 1
            fi
          fi
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

      - name: Stage the exact release candidate
        if: steps.release_state.outputs.exists == 'false'
        id: candidate
        shell: bash
        run: |
          candidate="$RUNNER_TEMP/release-candidate"
          artifact_name="release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$candidate"
          cp dist/main.js dist/manifest.json dist/styles.css \
            "dist/chrono-notes-${RELEASE_VERSION}.zip" "$candidate/"
          (
            cd "$candidate"
            sha256sum main.js manifest.json styles.css "chrono-notes-${RELEASE_VERSION}.zip" > SHA256SUMS
          )
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Upload the verified release candidate
        if: steps.release_state.outputs.exists == 'false'
        id: upload_candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-candidate/
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  publish:
    if: github.event_name == 'push' && needs.verify.outputs.release_exists == 'false'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      CANDIDATE_ARTIFACT_DIGEST: ${{ needs.verify.outputs.candidate_artifact_digest }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.verify.outputs.candidate_artifact_id }}
      CANDIDATE_ARTIFACT_NAME: ${{ needs.verify.outputs.candidate_artifact_name }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
      RELEASE_VERSION: ${{ github.ref_name }}
      PREVIOUS_RELEASE_TAG: ${{ needs.verify.outputs.previous_tag }}
    steps:
      - name: Reverify release identity before using write credentials
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The prepared release commit is missing or invalid." >&2
            exit 1
          fi
          tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" --jq '.object')"
          tag_type="$(jq -r '.type' <<< "$tag_object")"
          tag_sha="$(jq -r '.sha' <<< "$tag_object")"
          for _ in {1..10}; do
            [[ "$tag_type" == "tag" ]] || break
            tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object')"
            tag_type="$(jq -r '.type' <<< "$tag_object")"
            tag_sha="$(jq -r '.sha' <<< "$tag_object")"
          done
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$RELEASE_COMMIT" ]]; then
            echo "The remote release tag no longer resolves to the prepared commit." >&2
            exit 1
          fi
          comparison="$(gh api "/repos/${GITHUB_REPOSITORY}/compare/${RELEASE_COMMIT}...${DEFAULT_BRANCH}" --jq '.status')"
          if [[ "$comparison" != "ahead" && "$comparison" != "identical" ]]; then
            echo "The prepared release commit is no longer reachable from the default branch." >&2
            exit 1
          fi

      - name: Download the exact candidate from this workflow attempt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          expected_artifact_name="release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "The prepared candidate artifact ID is missing or invalid." >&2
            exit 1
          fi
          if [[ "$CANDIDATE_ARTIFACT_NAME" != "$expected_artifact_name" ]]; then
            echo "The prepared candidate artifact is not bound to this workflow attempt." >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The prepared candidate artifact digest is missing or invalid." >&2
            exit 1
          fi

          artifact_response="$RUNNER_TEMP/release-candidate-artifact.json"
          gh api \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}" \
            > "$artifact_response"
          jq --exit-status \
            --arg artifact_id "$CANDIDATE_ARTIFACT_ID" \
            --arg artifact_name "$CANDIDATE_ARTIFACT_NAME" \
            --arg artifact_digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --arg release_commit "$RELEASE_COMMIT" \
            --argjson run_id "$GITHUB_RUN_ID" '
              (.id | tostring) == $artifact_id and
              .name == $artifact_name and
              (.digest == $artifact_digest or .digest == ("sha256:" + $artifact_digest)) and
              .expired == false and
              .workflow_run.id == $run_id and
              .workflow_run.head_sha == $release_commit
            ' "$artifact_response" >/dev/null || {
              echo "The GitHub artifact record does not match the prepared release candidate." >&2
              exit 1
            }

          artifact_zip="$RUNNER_TEMP/release-candidate-artifact.zip"
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            --output "$artifact_zip"
          downloaded_digest="$(sha256sum "$artifact_zip" | awk '{ print $1 }')"
          if [[ "$downloaded_digest" != "$CANDIDATE_ARTIFACT_DIGEST" ]]; then
            echo "The downloaded candidate ZIP digest does not match GitHub's server digest." >&2
            exit 1
          fi

          candidate="$RUNNER_TEMP/release-candidate"
          python3 - "$artifact_zip" "$candidate" "$RELEASE_VERSION" <<'PY'
          # RELEASE_ZIP_VALIDATOR_BEGIN
          import sys

          if sys.version_info < (3, 9):
              raise SystemExit("Release ZIP validation requires Python 3.9 or newer")

          import hashlib
          import re
          import shutil
          import stat
          import zipfile
          from pathlib import Path


          class ValidationError(Exception):
              pass


          MAX_ZIP_ENTRY_BYTES = 8 * 1024 * 1024
          MAX_ZIP_TOTAL_BYTES = 24 * 1024 * 1024


          def validate_path(info):
              original = info.orig_filename
              name = info.filename
              if "\0" in original:
                  raise ValidationError("archive path contains a NUL byte")
              if "\\" in original:
                  raise ValidationError(f"archive path contains a backslash: {original!r}")
              if any(ord(character) < 32 or ord(character) == 127 for character in original):
                  raise ValidationError(f"archive path contains a control character: {original!r}")
              if original != name:
                  raise ValidationError(f"archive path was normalized ambiguously: {original!r}")
              if name.startswith("/") or re.match(r"^[A-Za-z]:", name):
                  raise ValidationError(f"archive path is absolute: {name!r}")
              parts = name.split("/")
              if not parts or any(part in {"", ".", ".."} for part in parts):
                  raise ValidationError(f"archive path is not canonical: {name!r}")
              if "/".join(parts) != name:
                  raise ValidationError(f"archive path is not canonical: {name!r}")
              return name


          def validate_regular_file(info, *, fixed_mode=None):
              if info.flag_bits & 0x1:
                  raise ValidationError(f"encrypted archive entry is forbidden: {info.filename!r}")
              if info.is_dir() or info.external_attr & 0x10:
                  raise ValidationError(f"directory archive entry is forbidden: {info.filename!r}")
              unix_mode = (info.external_attr >> 16) & 0xFFFF
              if info.create_system == 3:
                  if stat.S_IFMT(unix_mode) != stat.S_IFREG:
                      raise ValidationError(
                          f"non-regular archive entry is forbidden: {info.filename!r}"
                      )
                  if fixed_mode is not None and unix_mode != fixed_mode:
                      raise ValidationError(
                          f"archive entry mode is not fixed at {oct(fixed_mode)}: {info.filename!r}"
                      )
              elif fixed_mode is not None:
                  raise ValidationError(
                      f"archive entry lacks the required Unix file mode: {info.filename!r}"
                  )
              # GitHub's artifact ZIP may use DOS metadata. With the exact ASCII
              # inventory already pinned, a DOS non-directory is safely copied only
              # to its known regular-file target rather than trusting its path.


          def validate_inventory(archive, expected_names, *, fixed_mode=None, exact_order=False):
              infos = archive.infolist()
              names = []
              by_name = {}
              total_size = 0
              for info in infos:
                  name = validate_path(info)
                  validate_regular_file(info, fixed_mode=fixed_mode)
                  if info.file_size < 0 or info.file_size > MAX_ZIP_ENTRY_BYTES:
                      raise ValidationError(
                          f"archive entry exceeds the {MAX_ZIP_ENTRY_BYTES}-byte limit: {name!r}"
                      )
                  total_size += info.file_size
                  if total_size > MAX_ZIP_TOTAL_BYTES:
                      raise ValidationError(
                          f"archive exceeds the {MAX_ZIP_TOTAL_BYTES}-byte total limit"
                      )
                  if name in by_name:
                      raise ValidationError(f"duplicate archive entry is forbidden: {name!r}")
                  names.append(name)
                  by_name[name] = info
              if len(names) != len(expected_names) or set(names) != set(expected_names):
                  raise ValidationError(
                      f"archive inventory mismatch: expected {expected_names!r}, found {names!r}"
                  )
              if exact_order and names != expected_names:
                  raise ValidationError(
                      f"archive entry order mismatch: expected {expected_names!r}, found {names!r}"
                  )
              return by_name


          def validate_checksums(candidate, archive_name):
              expected_names = ["main.js", "manifest.json", "styles.css", archive_name]
              manifest_path = candidate / "SHA256SUMS"
              try:
                  manifest_bytes = manifest_path.read_bytes()
                  manifest = manifest_bytes.decode("ascii")
              except (OSError, UnicodeDecodeError) as error:
                  raise ValidationError("SHA256SUMS must be readable ASCII") from error
              if not manifest.endswith("\n") or "\r" in manifest:
                  raise ValidationError("SHA256SUMS must use canonical LF-terminated lines")
              lines = manifest.splitlines()
              if len(lines) != len(expected_names):
                  raise ValidationError("SHA256SUMS does not contain the exact four checksums")
              records = []
              for line in lines:
                  match = re.fullmatch(r"([0-9a-f]{64})  ([A-Za-z0-9.-]+)", line)
                  if match is None:
                      raise ValidationError(f"SHA256SUMS entry is non-canonical: {line!r}")
                  records.append((match.group(1), match.group(2)))
              names = [name for _, name in records]
              if len(set(names)) != len(names):
                  raise ValidationError("SHA256SUMS contains a duplicate file entry")
              if set(names) != set(expected_names):
                  raise ValidationError("SHA256SUMS file inventory is incomplete or contains extras")
              if names != expected_names:
                  raise ValidationError("SHA256SUMS entries are not in canonical order")
              for (expected_digest, expected_name) in records:
                  actual_digest = hashlib.sha256((candidate / expected_name).read_bytes()).hexdigest()
                  if actual_digest != expected_digest:
                      raise ValidationError(f"SHA256SUMS mismatch for {expected_name}")


          def validate_install_archive(candidate, archive_name):
              expected_names = [
                  "chrono-notes/main.js",
                  "chrono-notes/manifest.json",
                  "chrono-notes/styles.css",
              ]
              try:
                  with zipfile.ZipFile(candidate / archive_name, "r") as archive:
                      entries = validate_inventory(
                          archive,
                          expected_names,
                          fixed_mode=stat.S_IFREG | 0o644,
                          exact_order=True,
                      )
                      for name in expected_names:
                          loose_name = name.removeprefix("chrono-notes/")
                          if archive.read(entries[name]) != (candidate / loose_name).read_bytes():
                              raise ValidationError(
                                  f"manual installation archive differs from loose asset {loose_name}"
                              )
              except zipfile.BadZipFile as error:
                  raise ValidationError("manual installation archive is not a valid ZIP") from error


          def main():
              if len(sys.argv) != 4:
                  raise ValidationError("expected artifact ZIP, candidate directory, and release version")
              artifact_path = Path(sys.argv[1])
              candidate = Path(sys.argv[2])
              version = sys.argv[3]
              if re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version) is None:
                  raise ValidationError("release version is not canonical")
              archive_name = f"chrono-notes-{version}.zip"
              expected_outer_names = [
                  "SHA256SUMS",
                  archive_name,
                  "main.js",
                  "manifest.json",
                  "styles.css",
              ]
              try:
                  with zipfile.ZipFile(artifact_path, "r") as archive:
                      entries = validate_inventory(archive, expected_outer_names)
                      candidate.mkdir(mode=0o700)
                      for name in expected_outer_names:
                          target = candidate / name
                          with archive.open(entries[name], "r") as source, target.open("xb") as output:
                              shutil.copyfileobj(source, output)
              except zipfile.BadZipFile as error:
                  raise ValidationError("Actions artifact is not a valid ZIP") from error
              validate_checksums(candidate, archive_name)
              validate_install_archive(candidate, archive_name)


          try:
              main()
          except (OSError, ValidationError, zipfile.BadZipFile) as error:
              raise SystemExit(f"Release ZIP validation failed: {error}") from error
          # RELEASE_ZIP_VALIDATOR_END
          PY
          if [[ "$(jq -r '.version' "$candidate/manifest.json")" != "$RELEASE_VERSION" ]]; then
            echo "The candidate manifest version no longer matches the release tag." >&2
            exit 1
          fi

      - name: Attest Obsidian release assets
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/release-candidate/main.js
            ${{ runner.temp }}/release-candidate/manifest.json
            ${{ runner.temp }}/release-candidate/styles.css
            ${{ runner.temp }}/release-candidate/chrono-notes-${{ env.RELEASE_VERSION }}.zip

      - name: Publish and verify the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          verify_tag() {
            local object type sha
            object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" --jq '.object')"
            type="$(jq -r '.type' <<< "$object")"
            sha="$(jq -r '.sha' <<< "$object")"
            for _ in {1..10}; do
              [[ "$type" == "tag" ]] || break
              object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object')"
              type="$(jq -r '.type' <<< "$object")"
              sha="$(jq -r '.sha' <<< "$object")"
            done
            [[ "$type" == "commit" && "$sha" == "$RELEASE_COMMIT" ]]
          }

          candidate="$RUNNER_TEMP/release-candidate"
          archive_name="chrono-notes-${RELEASE_VERSION}.zip"
          assets=("$candidate/main.js" "$candidate/manifest.json" "$candidate/styles.css" "$candidate/$archive_name")
          notes_arguments=(--generate-notes)
          if [[ -n "$PREVIOUS_RELEASE_TAG" ]]; then
            notes_arguments+=(--notes-start-tag "$PREVIOUS_RELEASE_TAG")
          fi
          verify_tag || { echo "The release tag changed before publication." >&2; exit 1; }
          gh release create "$RELEASE_VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_VERSION" "${notes_arguments[@]}"
          verify_tag || { echo "The release tag changed during publication." >&2; exit 1; }

          release_response="$RUNNER_TEMP/published-release.json"
          for attempt in {1..10}; do
            if ! release_status="$(curl --silent --show-error --output "$release_response" --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}")"; then
              release_status="000"
            fi
            if [[ "$release_status" == "200" ]] && jq --exit-status --arg archive_name "$archive_name" '
              .immutable == true and .draft == false and .prerelease == false and
              (.assets | type == "array") and
              ([.assets[].name] | sort) == (["main.js", "manifest.json", "styles.css", $archive_name] | sort) and
              ([.assets[].name] | unique | length) == 4
            ' "$release_response" >/dev/null; then
              break
            fi
            if [[ "$release_status" =~ ^4[0-9][0-9]$ && "$release_status" != "404" ]]; then
              echo "Published Release verification failed with non-retryable HTTP ${release_status}." >&2
              exit 1
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo "Published Release did not reach the exact immutable contract after bounded retries (last HTTP ${release_status})." >&2
              exit 1
            fi
            sleep "$((attempt * 2))"
          done

          remote="$RUNNER_TEMP/published-release-assets"
          mkdir "$remote"
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$remote" \
            --pattern main.js --pattern manifest.json --pattern styles.css --pattern "$archive_name"
          for asset in main.js manifest.json styles.css "$archive_name"; do
            cmp "$candidate/$asset" "$remote/$asset"
            gh attestation verify "$remote/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --deny-self-hosted-runners \
              --source-ref "$GITHUB_REF" \
              --source-digest "$RELEASE_COMMIT"
          done
          verify_tag || { echo "The release tag changed after publication verification." >&2; exit 1; }
