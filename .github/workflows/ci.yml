name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Verify runtime contract
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci

      - name: Type-check, test, and build
        run: npm run check

      - name: Test deterministic date behavior across time zones
        run: npm run test:timezones

      - name: Run the quick algorithmic benchmark gate
        run: npm run bench:quick

      - name: Run the 10k single-file update guardrail
        run: npm run bench:single-file:large

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Report production artifact gate
        run: npm run artifact:check -- --details

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chrono-notes-coverage
          path: coverage/
          if-no-files-found: error

      - name: Upload production plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chrono-notes-production
          path: dist/
          if-no-files-found: error
